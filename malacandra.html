<title>Atlas de Malacandra</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Marcellus&family=Alegreya+Sans:wght@400;500;700&display=swap">
<style>
  /* Layout: escena 3D a sangre a la izquierda, cuaderno de campo a la derecha (hoja inferior en movil). */
  :root {
    --night: #1c1222;
    --ink: #2a1b33;
    --ink-2: #3a2745;
    --line: #5a4266;
    --paper: #f8e9ec;
    --rose: #e9aebb;
    --muted: #c3abc6;
    --gold: #e6b655;
    --display: "Marcellus", "Iowan Old Style", Georgia, serif;
    --body: "Alegreya Sans", "Segoe UI", system-ui, sans-serif;
    color-scheme: dark;
  }
  html, body { height: 100%; }
  body { background: var(--night); color: var(--paper); font-family: var(--body); font-size: 16px; line-height: 1.5; overflow: hidden; }
  button { font: inherit; color: inherit; cursor: pointer; }
  :focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }

  #app { height: 100%; display: grid; grid-template-columns: minmax(0, 1fr) 372px; }
  #stage { position: relative; min-width: 0; min-height: 0; overflow: hidden; background: var(--night); }
  #c { display: block; width: 100%; height: 100%; touch-action: none; }
  #labels { position: absolute; inset: 0; overflow: hidden; pointer-events: none; }

  #brand { position: absolute; top: 14px; left: max(16px, env(safe-area-inset-left, 0px)); right: 16px; pointer-events: none; text-shadow: 0 1px 10px rgba(28, 18, 34, .75); }
  #brand h1 { margin: 0; font-family: var(--display); font-weight: 400; font-size: clamp(1.5rem, 3.4vw, 2.3rem); letter-spacing: .04em; line-height: 1.1; }
  #brand p { margin: 2px 0 0; font-size: .86rem; letter-spacing: .08em; text-transform: uppercase; color: var(--paper); opacity: .85; }

  .lab { position: absolute; left: 0; top: 0; pointer-events: auto; white-space: nowrap; font-size: .8rem; font-weight: 500; letter-spacing: .03em; line-height: 1.2;
    padding: 3px 10px 4px; border-radius: 999px; border: 1px solid rgba(230, 182, 85, .6); background: rgba(42, 27, 51, .86); color: var(--paper); will-change: transform; }
  .lab::after { content: ""; position: absolute; left: 50%; top: 100%; width: 1px; height: 9px; background: var(--gold); }
  .lab:hover { background: var(--ink-2); }
  .lab[aria-pressed="true"] { background: var(--gold); color: var(--night); border-color: var(--gold); }
  .lab.locked { border-style: dashed; color: var(--muted); }
  .tick { position: absolute; left: 0; top: 0; font-size: .74rem; color: var(--paper); opacity: .8; font-variant-numeric: tabular-nums; white-space: nowrap; will-change: transform; }

  #panel { min-height: 0; overflow-y: auto; background: var(--ink); border-left: 1px solid var(--line); display: flex; flex-direction: column; gap: 18px;
    padding-block: 18px; padding-left: max(18px, env(safe-area-inset-left, 0px)); padding-right: max(18px, env(safe-area-inset-right, 0px)); }
  .tabs { display: grid; grid-template-columns: 1fr 1fr; gap: 4px; padding: 4px; background: var(--night); border-radius: 10px; flex: none; }
  .tabs button { border: 0; background: transparent; border-radius: 7px; padding: 8px 10px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; font-size: .82rem; color: var(--muted); }
  .tabs button[aria-selected="true"] { background: var(--ink-2); color: var(--gold); }

  #card { display: flex; flex-direction: column; gap: 8px; min-width: 0; }
  #card .eyebrow { font-size: .76rem; letter-spacing: .12em; text-transform: uppercase; color: var(--gold); }
  #card h2 { margin: 0; font-family: var(--display); font-weight: 400; font-size: 1.7rem; line-height: 1.15; text-wrap: balance; }
  #card .tag { color: var(--rose); font-style: italic; margin-top: -4px; }
  #card p { margin: 0; max-width: 62ch; }
  #card dl { margin: 6px 0 0; display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 6px 14px; border-top: 1px solid var(--line); padding-top: 12px; }
  #card dt { font-size: .76rem; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); padding-top: 3px; }
  #card dd { margin: 0; }
  #card .why { border-left: 2px solid var(--gold); padding-left: 12px; color: var(--paper); }
  #card .why b { color: var(--gold); font-weight: 700; }

  .listwrap { display: flex; flex-direction: column; gap: 8px; }
  .listwrap h3 { margin: 0; font-size: .76rem; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); font-weight: 500; }
  #list { display: flex; flex-wrap: wrap; gap: 6px; }
  #list button { border: 1px solid var(--line); background: transparent; border-radius: 999px; padding: 4px 12px; font-size: .9rem; white-space: nowrap; }
  #list button:hover { border-color: var(--rose); }
  #list button[aria-pressed="true"] { background: var(--gold); border-color: var(--gold); color: var(--night); font-weight: 700; }
  #list button.locked { border-style: dashed; color: var(--muted); }
  .hint { margin: 0; font-size: .86rem; color: var(--muted); border-top: 1px solid var(--line); padding-top: 12px; }
  #nogl { position: absolute; inset: 0; display: grid; place-items: center; padding: 24px; text-align: center; color: var(--paper); }
  [hidden] { display: none !important; }
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
  select { font: inherit; color: var(--paper); background: var(--night); border: 1px solid var(--line); border-radius: 8px; height: 34px; padding: 0 8px; min-width: 0; }
  .btn { border: 1px solid var(--line); background: transparent; border-radius: 999px; padding: 5px 14px; font-size: .9rem; }
  .btn:hover { border-color: var(--rose); }
  .btn.primary { background: var(--gold); border-color: var(--gold); color: var(--night); font-weight: 700; }

  /* Selector de capítulo */
  .chap { flex: none; display: flex; flex-direction: column; gap: 8px; }
  .chaprow { display: flex; align-items: center; gap: 6px; }
  .chaprow label { font-size: .76rem; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); margin-right: auto; }
  .chaprow .step { width: 34px; height: 34px; flex: none; border: 1px solid var(--line); background: var(--night); border-radius: 8px; font-size: 1.15rem; line-height: 1; padding: 0; }
  .chaprow .step:hover:not(:disabled) { border-color: var(--rose); }
  .chaprow .step:disabled { opacity: .35; cursor: default; }
  .chaprow .of { color: var(--muted); font-size: .9rem; white-space: nowrap; }
  .chask { display: flex; flex-direction: column; gap: 8px; padding: 10px 12px; border: 1px solid var(--gold); border-radius: 10px; background: var(--ink-2); }
  .chask p { margin: 0; font-size: .95rem; }
  .chask div { display: flex; flex-wrap: wrap; gap: 8px; }

  /* Primera visita */
  #first { position: absolute; inset: 0; z-index: 2; display: flex; align-items: center; justify-content: center; padding: 16px; background: rgba(28, 18, 34, .6); }
  .firstcard { width: 100%; max-width: 360px; display: flex; flex-direction: column; gap: 10px; padding: 20px; background: var(--ink); border: 1px solid var(--line); border-radius: 14px; box-shadow: 0 12px 40px rgba(0, 0, 0, .45); }
  .firstcard h2 { margin: 0; font-family: var(--display); font-weight: 400; font-size: 1.6rem; line-height: 1.15; }
  .firstcard p { margin: 0; color: var(--muted); }
  .firstcard .row { display: flex; gap: 8px; margin-top: 4px; }
  .firstcard select { flex: 1; min-width: 0; }

  /* Ransom está aquí */
  .here { position: absolute; left: 0; top: 0; pointer-events: none; white-space: nowrap; font-size: .72rem; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: var(--gold);
    padding: 2px 8px 3px; border-radius: 6px; background: rgba(28, 18, 34, .8); will-change: transform; }
  #list .dot { display: inline-block; width: 6px; height: 6px; margin-left: 7px; border-radius: 50%; background: var(--gold); vertical-align: middle; position: relative; top: -1px; }
  #list button[aria-pressed="true"] .dot { background: var(--night); }

  @media (max-width: 780px) {
    #app { grid-template-columns: minmax(0, 1fr); grid-template-rows: minmax(0, 1fr) auto; }
    #panel { border-left: 0; border-top: 1px solid var(--line); max-height: 47vh; gap: 12px; padding-block: 12px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
    #card h2 { font-size: 1.4rem; }
    #list { flex-wrap: nowrap; overflow-x: auto; padding-bottom: 4px; }
    #brand p { font-size: .72rem; }
  }
</style>

<div id="app">
  <div id="stage">
    <canvas id="c" aria-label="Escena 3D de Malacandra"></canvas>
    <div id="labels"></div>
    <div id="brand">
      <h1>Malacandra</h1>
      <p>Elige tu capítulo</p>
    </div>
    <div id="nogl" hidden>Este navegador no pudo iniciar WebGL, así que la escena 3D no se puede mostrar. Las fichas del panel siguen funcionando.</div>
    <div id="first" hidden>
      <div class="firstcard" role="dialog" aria-labelledby="first-t">
        <h2 id="first-t">¿En qué capítulo vas?</h2>
        <p>El atlas solo muestra lo que Ransom ya sabe en ese punto.</p>
        <div class="row">
          <label for="firstsel" class="sr">Capítulo</label>
          <select id="firstsel"></select>
          <button id="firstgo" class="btn primary">Empezar</button>
        </div>
      </div>
    </div>
  </div>
  <aside id="panel">
    <div class="chap" id="chap" hidden>
      <div class="chaprow">
        <label for="chsel">Capítulo</label>
        <button id="chprev" class="step" aria-label="Capítulo anterior">&lsaquo;</button>
        <select id="chsel"></select>
        <button id="chnext" class="step" aria-label="Capítulo siguiente">&rsaquo;</button>
        <span class="of">de 22</span>
      </div>
      <div class="chask" id="chask" hidden>
        <p id="chmsg"></p>
        <div><button id="chyes" class="btn primary">Sí, revelar</button><button id="chno" class="btn">Cancelar</button></div>
      </div>
    </div>
    <div class="tabs" role="tablist" aria-label="Vista">
      <button id="tab-world" role="tab" aria-selected="true">El mundo</button>
      <button id="tab-gal" role="tab" aria-selected="false">Habitantes</button>
    </div>
    <section id="card" aria-live="polite"></section>
    <div class="listwrap">
      <h3 id="list-title">Lugares</h3>
      <div id="list"></div>
    </div>
    <p class="hint" id="hint"></p>
  </aside>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script>
(function () {
  'use strict';
  var $ = function (s) { return document.querySelector(s); };
  var stage = $('#stage'), canvas = $('#c'), labelsEl = $('#labels');
  var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  /* ---------- Contenido por capítulo ----------
     Cada ítem es { id, from, v: [versiones] }. Existe para el lector desde "from".
     Se muestra la última versión con from <= CH. Lo que una versión omite se hereda de la anterior. */
  var TOTAL = 22;
  var WHY_GRAV = ['La idea base', 'Con menos gravedad, un cuerpo puede ser mucho más alto y delgado sin romperse. Por eso todos aquí parecen estirados.'];
  var INTRO = {
    world: { v: [
      { from: 1, cap: 'Capítulos 1 a 6', name: 'Todavía no has llegado', tag: '',
        text: 'En este capítulo Ransom aún no pisa Malacandra. Esta parte del atlas llegará pronto.' },
      { from: 7, cap: 'Más allá del planeta silencioso', name: 'Un mundo desconocido', tag: 'Ransom no sabe dónde está',
        text: 'Ransom no sabe en qué mundo ha caído. Ve agua azul, suelo rosado, un bosque púrpura y montañas como agujas. Todo parece demasiado alto y delgado.',
        why: ['La idea base', 'Aquí las cosas pesan menos que en la Tierra. Por eso pueden estirarse hacia arriba sin caerse.'] },
      { from: 11, name: 'Malacandra', tag: 'Así lo llaman sus habitantes',
        text: 'Los hrossa llaman Malacandra a su mundo. De ellos Ransom aprende que hay una tierra baja, el handramit, y una tierra alta, el harandra. Aún no sabe qué planeta es.' },
      { from: 14, name: 'Un mundo de dos pisos', tag: 'Malacandra es el nombre que sus habitantes dan a Marte',
        text: 'Arriba está el harandra: roca fría, casi sin aire. Abajo, los handramits: cañones profundos donde se juntan el aire, el agua tibia y toda la vida. Ransom aterriza en uno de ellos.',
        why: ['La idea base', 'El planeta tiene poco aire, y el aire pesa. Se acumula en lo más hondo, igual que el agua. Por eso se vive abajo y arriba el cielo es casi negro.'] }
    ] },
    gal: { v: [
      { from: 1, cap: 'Quién aparece', name: 'Los viajeros', tag: 'Tres hombres de la Tierra',
        text: 'Tres hombres de la Tierra: Ransom y los dos que se lo llevan. Las figuras están a escala entre sí. La regla de la izquierda marca metros.' },
      { from: 7, name: 'Criaturas de Malacandra', tag: 'Seres que Ransom no entiende',
        text: 'Ransom ve seres que no entiende y les teme. Aún no sabe cuáles piensan y cuáles son bestias. Las figuras están a escala. La regla de la izquierda marca metros.',
        why: WHY_GRAV },
      { from: 11, cap: 'Los que habitan Malacandra', name: 'Hnau', tag: 'Toda criatura con razón',
        text: 'Hay tres especies hnau: hrossa, séroni y pfifltriggi. Ninguna manda sobre las otras, y cada una hace lo que mejor sabe. Las figuras están a escala entre sí. La regla de la izquierda marca metros.' }
    ] }
  };
  var NEUTRAL = { cap: 'Atlas de Malacandra', name: 'Elige tu capítulo', tag: '',
    text: 'Dime en qué capítulo vas. El atlas mostrará solo lo que Ransom ya sabe en ese punto.' };

  var PLACES = [
    { id: 'handramit', from: 7, v: [
      { from: 7, name: 'El valle', tag: 'Agua tibia entre paredes', cap: 'Capítulo 7',
        text: 'Un valle largo de suelo rosado y blando. El agua es azul y tibia, con olas altas y estrechas. Ransom huye por él sin rumbo.' },
      { from: 9, cap: 'Capítulos 7 a 9',
        text: 'Un valle largo de suelo rosado y blando, con agua azul y tibia. A la orilla, Ransom encuentra a una criatura negra y la oye hablar. Su curiosidad de filólogo vence al miedo. Es Hyoi.' },
      { from: 11, name: 'Handramit', tag: 'La tierra baja', cap: 'Capítulos 7 a 11',
        text: 'Los hrossa llaman handramit a la tierra baja donde viven. Es un valle hondo de suelo rosado y blando, con agua azul y tibia y bosques púrpura.',
        facts: [['Aire', 'Denso y templado'], ['Agua', 'Azul, tibia, con olas altas y estrechas'], ['Viven aquí', 'Los hrossa']] },
      { from: 14, cap: 'Capítulos 7 a 14',
        text: 'Un cañón enorme cortado en la superficie. Suelo cubierto de una hierba rosada y blanda, agua azul y tibia, bosques púrpura. Subiendo por su pared, Ransom entiende que los handramits son los famosos canales que se ven desde la Tierra.' }
    ] },
    { id: 'harandra', from: 11, v: [
      { from: 11, name: 'Harandra', tag: 'La tierra alta', cap: 'Solo de oídas', locked: true,
        text: 'Los hrossa dicen que arriba, más allá de las paredes del valle, está la tierra alta. Ellos no viven allí. Es territorio de los séroni.' },
      { from: 14, cap: 'Capítulo 14', locked: false,
        text: 'La verdadera superficie del planeta. Roca desnuda, frío, y un aire tan delgado que un hombre no puede respirarlo.',
        why: ['Mira el cielo', 'Sube la cámara. Cuanto más alto, menos aire hay para dispersar la luz, así que el cielo se oscurece y aparecen estrellas en pleno día.'] },
      { from: 15, cap: 'Capítulos 14 y 15',
        text: 'La verdadera superficie del planeta. Roca desnuda, frío, y un aire tan delgado que un hombre no puede respirarlo. Augray le da oxígeno a Ransom para cruzarlo.' }
    ] },
    { id: 'nave', from: 7, v: [
      { from: 7, name: 'La nave y la cabaña', tag: 'Donde empieza todo', cap: 'Capítulos 3 a 7',
        text: 'Una esfera de metal. Weston y Devine aterrizan junto al agua, donde ya tenían una cabaña de un viaje anterior. Aquí Ransom ve a los sorns acercarse por primera vez, se suelta y huye.',
        facts: [['Forma', 'Esfera, se vive sobre la cara interior'], ['Tripulación', 'Weston, Devine y Ransom a la fuerza']] }
    ] },
    { id: 'bosque', from: 7, v: [
      { from: 7, name: 'Bosque púrpura', tag: 'Tallos como torres', cap: 'Capítulos 7 y 8',
        text: 'Tallos lisos y delgadísimos, del doble de alto que un olmo, con hojas enormes y casi transparentes solo en la copa. Ransom lo cruza solo en sus primeras horas, sin saber qué se puede comer ni beber.' }
    ] },
    { id: 'agujas', from: 7, v: [
      { from: 7, name: 'Agujas verde pálido', tag: 'Las montañas del borde', cap: 'Capítulos 7 y 8',
        text: 'Las montañas no forman lomas. Son agujas que parecen a punto de caerse. Lo mismo pasa con las olas, las plantas y los cuerpos: todo es demasiado alto para su ancho.',
        why: ['Por qué', 'Malacandra es más pequeño que la Tierra y tira de las cosas con menos fuerza. Lo que en la Tierra se derrumbaría, aquí se sostiene.'] }
    ] },
    { id: 'rosa', from: 7, v: [
      { from: 7, name: 'Masas rosadas', tag: 'Algo sobre la tierra alta', cap: 'Capítulo 7',
        text: 'Más allá de las agujas, Ransom ve unas formas rosadas gigantescas, como nubes quietas o la copa de una coliflor roja. Todavía no sabe qué son.' }
    ] },
    { id: 'aldea', from: 10, v: [
      { from: 10, name: 'Aldea de los hrossa', tag: 'A la orilla del agua', cap: 'Capítulo 10',
        text: 'Hyoi lleva a Ransom en barca durante un largo viaje hasta su aldea. Las chozas tienen forma de colmena y están hechas de hojas rígidas, junto al agua. Los hrossa lo reciben con curiosidad, sin miedo.' },
      { from: 11, cap: 'Capítulos 10 y 11',
        text: 'Chozas con forma de colmena hechas de hojas rígidas. Los hrossa viven junto al agua: navegan, pescan, cultivan y componen poesía. Aquí Ransom pasa semanas aprendiendo su lengua con Hnohra y hablando con Hyoi.',
        facts: [['En la escena', 'Hyoi con Ransom, Hnohra y Whin']] },
      { from: 12, cap: 'Capítulos 10 a 12',
        facts: [['En la escena', 'Hyoi con Ransom, Hnohra, Whin y la cachorra Hrikki, que habla con un eldil']] }
    ] },
    { id: 'hnakra', from: 13, v: [
      { from: 13, name: 'Aguas del hnakra', tag: 'La caza', cap: 'Capítulo 13',
        text: 'Cazar al hnakra es el mayor honor de un hross. Ransom va en la barca con Hyoi y Whin y lo consiguen. Justo después, un disparo de Weston mata a Hyoi, y un eldil ordena a Ransom ir a ver a Oyarsa.' }
    ] },
    { id: 'rebano', from: 8, v: [
      { from: 8, name: 'Bestias amarillas', tag: 'El rebaño de los sorns', cap: 'Capítulo 8',
        text: 'Animales altísimos, de pelaje amarillo pálido y cuello largo, que comen las copas del bosque. Ransom los encuentra en su huida y luego oye la voz de un sorn que los guía.' }
    ] },
    { id: 'torre', from: 14, v: [
      { from: 14, name: 'Torre de Augray', tag: 'Una cueva en la pared', cap: 'Capítulo 14',
        text: 'El camino sube por la pared del handramit. Con la altura el aire se vuelve delgado y frío, y a Ransom le cuesta respirar. Aquí entiende que está en Marte. Llega agotado a la cueva de Augray.',
        facts: [['Camino', 'La línea clara que sube desde la aldea']] },
      { from: 15, cap: 'Capítulos 14 y 15',
        text: 'El camino sube por la pared del handramit hasta casi la tierra alta. Arriba, a Ransom ya le falta el aire. Augray, un sorn, lo recibe junto al fuego, le da oxígeno y le deja mirar el cielo con su instrumento.' }
    ] },
    { id: 'thulcandra', from: 11, v: [
      { from: 11, name: 'Thulcandra', tag: 'El planeta silencioso', cap: 'Capítulo 11',
        text: 'Los hrossa saben que existe un mundo del que nunca llega ninguna voz. Cuando Ransom les cuenta de dónde viene, concluyen que viene de allí. Es el punto azul que aparece cuando el cielo se oscurece.' },
      { from: 15, tag: 'El planeta silencioso: la Tierra', cap: 'Capítulos 11 y 15',
        text: 'Un mundo del que nunca llega ninguna voz. Los hrossa concluyen que Ransom viene de allí. Augray se lo muestra con su instrumento y Ransom lo reconoce: es la Tierra. Es el punto azul que aparece cuando el cielo se oscurece.' }
    ] },
    { id: 'meldilorn', from: 13, v: [
      { from: 13, name: 'Hacia Meldilorn', tag: 'Todavía no has llegado', cap: 'Más adelante', locked: true,
        text: 'Donde vive Oyarsa, quien gobierna Malacandra. Es el destino de Ransom, al otro lado de la tierra alta. Queda fuera del mapa hasta que avances en el libro.' }
    ] }
  ];

  var HROSS_BODY = 'Piensa en una nutria, una foca y un pingüino estirados hasta la altura de un hombre alto. Pelaje negro, espeso y lustroso. Patas muy cortas con pies palmeados, cola ancha como de castor, brazos fuertes con manos palmeadas. Cabeza redonda con bigotes largos, la frente más alta que la de una foca.';
  var FOLK = [
    { id: 'hross', from: 9, v: [
      { from: 9, name: 'Hross', tag: 'La criatura que habla', cap: 'Capítulo 9', text: HROSS_BODY,
        facts: [['Altura', '1,8 a 2,1 m'], ['Conoces a', 'Hyoi']] },
      { from: 10, name: 'Hrossa', tag: 'Los que viven junto al agua', cap: 'Desde el capítulo 9',
        facts: [['Altura', '1,8 a 2,1 m'], ['Viven', 'A la orilla del agua, en el handramit'], ['Hacen', 'Barcas, pesca y cultivos'], ['Conoces a', 'Hyoi, tu amigo. Hnohra, el viejo de hocico gris que te enseña la lengua.']] },
      { from: 11, tag: 'Los poetas del agua',
